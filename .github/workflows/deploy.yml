name: Deploy Freightskills
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: freightskills-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_LAUNCH_APPROVED: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check search visibility before deployment
        shell: bash
        run: |
          npm run start -- --port 4183 > /tmp/freightskills-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4183/robots.txt > /dev/null; then break; fi
            sleep 1
          done
          npm run check:seo -- http://127.0.0.1:4183
      - name: Deploy to Cloudflare
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3ca37b48945576cf4efcd4724ffc357e
